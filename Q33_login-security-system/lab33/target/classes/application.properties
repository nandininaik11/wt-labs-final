# application.properties - Central configuration file for Spring Boot
# Every key=value here controls how the app behaves

# ---- SERVER ----
server.port=8080

# ---- H2 IN-MEMORY DATABASE ----
# datasource: where to store data (memory = wiped on restart)
spring.datasource.url=jdbc:h2:mem:logindb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / HIBERNATE ----
# ddl-auto=update: auto-creates/updates DB tables from Java @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- H2 CONSOLE (browser-based DB viewer) ----
# Visit http://localhost:8080/h2-console to inspect data
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- THYMELEAF ----
spring.thymeleaf.cache=false

# ---- CUSTOM LOGIN SECURITY SETTINGS ----
# Max failed attempts before locking account
app.security.max-failed-attempts=3
# How many minutes before account auto-unlocks
app.security.lock-duration-minutes=15
