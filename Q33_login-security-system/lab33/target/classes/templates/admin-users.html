<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">🔐 LoginTracker — Admin</div>
    <div class="nav-links">
        <a href="/dashboard" class="btn btn-secondary btn-sm">Dashboard</a>
        <form action="/logout" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-danger btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>👥 User Management</h2>
        <p>Max failed attempts: <strong th:text="${maxAttempts}">3</strong> |
           Lock duration: <strong th:text="${lockMinutes}">15</strong> minutes</p>

        <!-- th:each = Thymeleaf loop (like for-each) over the users list -->
        <table class="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Failed Attempts</th>
                    <th>Status</th>
                    <th>Lock Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- th:each iterates the list; ${user} is each item -->
                <tr th:each="user : ${users}"
                    th:class="${user.accountNonLocked} ? '' : 'row-locked'">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role}"></td>
                    <td th:text="${user.failedAttempts}"></td>
                    <td>
                        <!-- Conditionally show LOCKED or ACTIVE badge -->
                        <span th:if="${user.accountNonLocked}" class="badge badge-green">✅ Active</span>
                        <span th:unless="${user.accountNonLocked}" class="badge badge-red">🔒 Locked</span>
                    </td>
                    <td th:text="${user.lockTime != null ? user.lockTime : 'N/A'}"></td>
                    <td>
                        <!-- Show Unlock button only for locked users -->
                        <form th:if="${!user.accountNonLocked}"
                              th:action="@{/admin/unlock/{id}(id=${user.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-primary btn-sm">Unlock</button>
                        </form>
                        <span th:if="${user.accountNonLocked}" style="color:#aaa;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
