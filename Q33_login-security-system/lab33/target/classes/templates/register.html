<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Lab 33</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="card login-card">
        <div class="card-header">
            <h2>📝 Register</h2>
            <p>Create a new account</p>
        </div>

        <!-- Error message (e.g., username taken) -->
        <div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <form action="/register" method="post">
            <!-- CSRF token always required for POST forms -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username">👤 Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">🔑 Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Choose a password (min 6 chars)" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <div class="card-footer">
            <p>Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</div>

</body>
</html>
