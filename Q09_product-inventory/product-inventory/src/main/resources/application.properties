# ============================================================
# application.properties
# This file configures how Spring Boot connects to MongoDB
# and sets up our application settings.
# ============================================================

# ---- Task 1: MongoDB Connection Configuration ----
# Tell Spring Boot where MongoDB is running
# Format: mongodb://host:port/database-name
spring.data.mongodb.uri=mongodb://localhost:27017/inventorydb

# Name of the MongoDB database to use
spring.data.mongodb.database=inventorydb

# ---- Server Configuration ----
# Port where the application runs (default is 8080)
server.port=8080

# ---- Logging (optional: shows MongoDB queries in console) ----
logging.level.org.springframework.data.mongodb=DEBUG

# ---- Application Name ----
spring.application.name=product-inventory
