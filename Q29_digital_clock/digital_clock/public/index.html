<!DOCTYPE html>
<!--
  public/index.html
  This is the ONLY HTML file in a React app (Single Page Application).
  React injects everything into the <div id="root"> below.
  You almost never edit this file manually.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="description" content="Real-Time Digital Clock built with React Hooks" />
    <title>⏰ Digital Clock — React Hooks</title>

    <!-- Google Fonts: Orbitron is a futuristic digital-style font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--
      noscript: shown if JavaScript is disabled in browser.
      React requires JavaScript — without it, nothing renders.
    -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!--
      ROOT DIV — This is where React mounts the entire app.
      React's ReactDOM.createRoot(document.getElementById('root'))
      targets this element and renders all components inside it.
    -->
    <div id="root"></div>
  </body>
</html>
