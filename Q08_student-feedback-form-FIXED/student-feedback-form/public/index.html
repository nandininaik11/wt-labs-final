<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Student Feedback Form - React Application"
    />
    
    <!-- Title shown in browser tab -->
    <title>Student Feedback Form - React Lab</title>
    
    <!-- Google Fonts for distinctive typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Fallback message if JavaScript is disabled -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Root div where React will mount the application -->
    <!-- This is the single DOM element React needs to render the entire app -->
    <div id="root"></div>
    
    <!--
      This HTML file is a template.
      React will inject the application into the #root div above.
      
      The build step will bundle all JavaScript and inject it here.
    -->
  </body>
</html>
