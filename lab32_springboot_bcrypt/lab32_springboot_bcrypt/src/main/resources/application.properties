# ================================================================
# application.properties — Spring Boot Configuration
# ================================================================
# This file configures the entire application:
# database, security, logging, server settings.
# Spring Boot reads this automatically on startup.
# ================================================================

# ── Server Configuration ─────────────────────────────────────
# Port the embedded Tomcat server listens on
# Default is 8080 — http://localhost:8080
server.port=8080

# ── H2 In-Memory Database Configuration ──────────────────────
# H2 is a Java database that runs in RAM — no MySQL install needed!
# Perfect for labs. Data is lost when the app stops.

# JDBC URL format: jdbc:h2:mem:DBNAME
# mem: = in-memory (vs file: = saved to disk)
spring.datasource.url=jdbc:h2:mem:lab32db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 Web Console (Browser-based DB viewer) ─────────────────
# Open http://localhost:8080/h2-console to view the database
# Like phpMyAdmin but for H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow access from browser (needed for Spring Security to permit it)
spring.h2.console.settings.web-allow-others=false

# ── JPA / Hibernate Configuration ─────────────────────────────
# JPA = Java Persistence API (ORM layer)
# Hibernate is the JPA implementation Spring Boot uses

# create-drop = DROP all tables on stop, CREATE fresh on start
# Other options: none, validate, update, create
# For lab: create-drop is perfect (fresh DB each run)
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console (helpful for learning/debugging)
spring.jpa.show-sql=true

# Format the SQL output so it's readable (not one long line)
spring.jpa.properties.hibernate.format_sql=true

# H2 Dialect — tells Hibernate what SQL syntax H2 uses
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Thymeleaf Template Configuration ─────────────────────────
# Thymeleaf = server-side HTML template engine
# Templates location: src/main/resources/templates/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Cache=false during development (see changes without restart)
spring.thymeleaf.cache=false

# ── Logging Configuration ─────────────────────────────────────
# Show Spring Security logs (useful for understanding auth flow)
logging.level.org.springframework.security=DEBUG
# Show our application's logs
logging.level.com.lab32=DEBUG
# Reduce Hibernate noise (only show warnings from Hibernate itself)
logging.level.org.hibernate.SQL=DEBUG

# ── Application Name ──────────────────────────────────────────
spring.application.name=lab32-bcrypt-security
