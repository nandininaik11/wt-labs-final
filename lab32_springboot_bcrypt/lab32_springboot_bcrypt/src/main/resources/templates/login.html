<!DOCTYPE html>
<!-- Thymeleaf namespace: th:* attributes are processed server-side -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Lab Q32 BCrypt Security</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #fff; border-radius: 16px;
            padding: 2.5rem; width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        .brand-icon { font-size: 2.5rem; margin-bottom: .5rem; }
        .form-control { border-radius: 8px; padding: .75rem 1rem; border: 1.5px solid #dee2e6; }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .btn-login { background: #2563eb; border: none; border-radius: 8px; padding: .75rem; font-weight: 600; width: 100%; }
        .btn-login:hover { background: #1d4ed8; }
        .demo-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1rem; margin-top: 1.2rem; }
        .demo-box code { font-size: .82rem; color: #2563eb; }
        .lock-badge { display: inline-flex; align-items: center; gap: 6px;
                      background: #eff6ff; color: #1d4ed8; border-radius: 999px;
                      padding: 4px 12px; font-size: .78rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="login-card">

    <!-- Header -->
    <div class="text-center mb-4">
        <div class="brand-icon">🔐</div>
        <h2 class="fw-bold mb-1">BCrypt Security</h2>
        <p class="text-muted small mb-2">Lab Q32 · Spring Boot Password Encryption</p>
        <span class="lock-badge">
            <i class="bi bi-shield-lock-fill"></i> Spring Security + BCrypt
        </span>
    </div>

    <!--
        Thymeleaf: th:if="${condition}" renders block only if true
        th:text="${variable}" sets element's text content
        *{...} = short form of ${registerRequest.fieldName}
    -->
    <!-- Success message (after registration or logout) -->
    <div th:if="${successMsg}" class="alert alert-success py-2 small"
         th:text="${successMsg}"></div>

    <!-- Error message (wrong password) -->
    <div th:if="${errorMsg}" class="alert alert-danger py-2 small"
         th:text="${errorMsg}"></div>

    <!--
        LOGIN FORM
        action="/login" method="post" → Spring Security intercepts this
        Spring Security reads 'username' and 'password' fields
        Compares password using BCryptPasswordEncoder.matches()
        (We configured usernameParameter and passwordParameter in SecurityConfig)
    -->
    <form th:action="@{/login}" method="post">
        <!--
            th:action="@{/url}" = Thymeleaf URL expression
            Automatically adds context path + CSRF token as hidden field
            Spring Security REQUIRES the CSRF token for POST requests
        -->

        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control"
                       placeholder="Enter username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter password" required id="pwdField">
                <button class="btn btn-outline-secondary" type="button"
                        onclick="togglePwd()">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
            <div class="form-text">Password is verified against BCrypt hash in DB</div>
        </div>

        <button type="submit" class="btn btn-login btn-primary">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <!-- Demo credentials box -->
    <div class="demo-box">
        <div class="fw-semibold small mb-2">
            <i class="bi bi-lightning-fill text-warning"></i> Demo Credentials
        </div>
        <div class="small">
            <span class="badge bg-danger me-1">ADMIN</span>
            <code>admin</code> / <code>admin123</code><br>
            <span class="badge bg-primary me-1 mt-1">USER</span>
            <code>alice</code> / <code>alice123</code><br>
            <span class="badge bg-primary me-1 mt-1">USER</span>
            <code>bob</code> / <code>bob123</code>
        </div>
    </div>

    <div class="text-center mt-3">
        <small class="text-muted">New user?
            <a th:href="@{/register}" class="text-decoration-none fw-semibold">
                Register here
            </a>
        </small>
    </div>
</div>

<script>
function togglePwd() {
    const field = document.getElementById('pwdField');
    const icon  = document.getElementById('eyeIcon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
