<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Lab Q32</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { min-height:100vh; background:linear-gradient(135deg,#1e3a5f,#0d1b2a);
               display:flex; align-items:center; justify-content:center; }
        .card { border-radius:16px; padding:2rem; max-width:480px; width:100%;
                box-shadow:0 20px 60px rgba(0,0,0,.4); border:none; }
        .form-control { border-radius:8px; padding:.65rem 1rem; }
        .form-control:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
        .bcrypt-note { background:#f0fff4; border:1px solid #bbf7d0; border-radius:8px;
                       padding:.75rem 1rem; font-size:.82rem; margin-top:1rem; }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center mb-3">
        <div style="font-size:2rem">📝</div>
        <h4 class="fw-bold mb-0">Create Account</h4>
        <small class="text-muted">Password will be BCrypt-hashed before storing</small>
    </div>

    <!-- Server-side error message -->
    <div th:if="${errorMsg}" class="alert alert-danger small py-2" th:text="${errorMsg}"></div>
    <div th:if="${passwordError}" class="alert alert-warning small py-2" th:text="${passwordError}"></div>

    <!--
        th:object="${registerRequest}" = binds form to the RegisterRequest DTO
        th:field="*{username}" = binds input to registerRequest.username field
        th:errors="*{username}" = shows validation errors for username field
    -->
    <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>

        <div class="mb-3">
            <label class="form-label fw-semibold">Username *</label>
            <input type="text" th:field="*{username}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                   placeholder="3–50 characters" required>
            <!-- th:classappend adds CSS class conditionally — is-invalid = red border -->
            <div class="invalid-feedback" th:errors="*{username}">Username error</div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email *</label>
            <input type="email" th:field="*{email}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                   placeholder="you@example.com" required>
            <div class="invalid-feedback" th:errors="*{email}">Email error</div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Password *</label>
            <input type="password" th:field="*{password}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                   placeholder="Min. 6 characters" required id="pwd1">
            <div class="invalid-feedback" th:errors="*{password}">Password error</div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password *</label>
            <input type="password" th:field="*{confirmPassword}"
                   class="form-control" placeholder="Repeat password" required id="pwd2"
                   oninput="checkMatch()">
            <div class="form-text" id="matchMsg"></div>
        </div>

        <div class="bcrypt-note">
            <i class="bi bi-shield-check text-success me-1"></i>
            <strong>Security Note:</strong> Your password will be hashed with
            <strong>BCrypt (strength=10)</strong> before being stored in the database.
            The plain password is <em>never</em> saved.
        </div>

        <div class="d-grid mt-3">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-person-plus-fill me-2"></i>Register
            </button>
        </div>
    </form>

    <div class="text-center mt-3">
        <small>Already have an account?
            <a th:href="@{/login}" class="text-decoration-none fw-semibold">Login here</a>
        </small>
    </div>
</div>
<script>
function checkMatch() {
    const p1 = document.getElementById('pwd1').value;
    const p2 = document.getElementById('pwd2').value;
    const msg = document.getElementById('matchMsg');
    if (p2.length === 0) { msg.textContent = ''; return; }
    if (p1 === p2) {
        msg.innerHTML = '<span class="text-success">✅ Passwords match</span>';
    } else {
        msg.innerHTML = '<span class="text-danger">❌ Passwords do not match</span>';
    }
}
</script>
</body>
</html>
