# ================================================================
# APPLICATION CONFIGURATION FILE
# This file contains all application settings and configurations
# Spring Boot reads this file automatically at startup
# ================================================================

# ----------------------------------------------------------------
# SERVER CONFIGURATION
# ----------------------------------------------------------------
# Port on which the application will run
# Default is 8080, you can change it if needed
server.port=8080

# Application name
spring.application.name=Online Bookstore

# ----------------------------------------------------------------
# DATABASE CONFIGURATION (MySQL)
# ----------------------------------------------------------------
# JDBC URL: jdbc:mysql://[host]:[port]/[database_name]
# localhost:3306 = MySQL server running on local machine at default port
# bookstore_db = name of the database (must be created before running)
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore_db?useSSL=false&serverTimezone=UTC

# MySQL username (default root, change if different)
spring.datasource.username=root

# MySQL password (change this to your MySQL root password)
# Leave empty if no password is set
spring.datasource.password=root

# MySQL JDBC Driver class
# Spring Boot auto-detects this, but explicit declaration is good practice
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------------------------------
# JPA (Java Persistence API) - standard for ORM in Java
# Hibernate - the JPA implementation used by Spring Boot

# DDL Auto: Controls database schema generation
# Options:
#   create - drops existing tables and creates new ones (DATA LOSS!)
#   create-drop - creates tables, drops them when app stops
#   update - updates schema without deleting data (RECOMMENDED for development)
#   validate - validates schema, makes no changes
#   none - no schema management
spring.jpa.hibernate.ddl-auto=update

# Show SQL: Print SQL statements to console (useful for debugging)
spring.jpa.show-sql=true

# Format SQL: Pretty-print SQL statements for readability
spring.jpa.properties.hibernate.format_sql=true

# SQL Dialect: MySQL-specific SQL syntax
# Tells Hibernate which database features are available
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------------------
# THYMELEAF CONFIGURATION
# ----------------------------------------------------------------
# Thymeleaf is the template engine for rendering HTML

# Template prefix: where templates are located
spring.thymeleaf.prefix=classpath:/templates/

# Template suffix: file extension for templates
spring.thymeleaf.suffix=.html

# Cache: Disable caching during development for instant changes
# Set to true in production for better performance
spring.thymeleaf.cache=false

# ----------------------------------------------------------------
# LOGGING CONFIGURATION
# ----------------------------------------------------------------
# Log level for different packages
# Levels: TRACE, DEBUG, INFO, WARN, ERROR

# Application logs
logging.level.com.bookstore=DEBUG

# Hibernate logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security logs
logging.level.org.springframework.security=DEBUG

# ----------------------------------------------------------------
# FILE UPLOAD CONFIGURATION
# ----------------------------------------------------------------
# Maximum file size for uploads (e.g., book cover images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------------------------------
# ENCODING CONFIGURATION
# ----------------------------------------------------------------
# Character encoding for HTTP requests/responses
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
