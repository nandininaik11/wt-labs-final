# =============================================================================
# APPLICATION.PROPERTIES - Spring Boot Configuration File
# This file configures various aspects of the Spring Boot application
# Properties are in key=value format
# =============================================================================

# -----------------------------------------------------------------------------
# SERVER CONFIGURATION
# Defines how the embedded Tomcat server runs
# -----------------------------------------------------------------------------

# Port number where the application will run
# Default is 8080, you can change to any available port (e.g., 8081, 9090)
server.port=8080

# Application context path (base URL path)
# Example: If set to /api, all URLs will be http://localhost:8080/api/...
# Leave empty for root context (http://localhost:8080/...)
server.servlet.context-path=/

# -----------------------------------------------------------------------------
# H2 DATABASE CONFIGURATION
# H2 is an in-memory database (data stored in RAM)
# Data is lost when application stops - perfect for development/testing
# -----------------------------------------------------------------------------

# JDBC URL for H2 database
# jdbc:h2:mem:orderdb - creates in-memory database named "orderdb"
# DB_CLOSE_DELAY=-1 - keeps database alive as long as JVM is running
# DB_CLOSE_ON_EXIT=FALSE - don't close database on exit
spring.datasource.url=jdbc:h2:mem:orderdb

# Database driver class name
# This tells Spring which database driver to use
spring.datasource.driverClassName=org.h2.Driver

# Database username (default for H2)
spring.datasource.username=sa

# Database password (empty by default for H2)
spring.datasource.password=

# -----------------------------------------------------------------------------
# JPA/HIBERNATE CONFIGURATION
# JPA = Java Persistence API (standard for ORM)
# Hibernate = Implementation of JPA
# -----------------------------------------------------------------------------

# Database platform/dialect
# Tells Hibernate which SQL dialect to use for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# DDL (Data Definition Language) auto mode
# create-drop: Creates schema on startup, drops on shutdown
# Other options: update (update schema), create (create new), validate (only validate)
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console
# Very useful for debugging - see what queries Hibernate generates
spring.jpa.show-sql=true

# Format SQL queries for better readability in console
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# H2 CONSOLE CONFIGURATION
# H2 provides a web-based database console for debugging
# Access at: http://localhost:8080/h2-console
# -----------------------------------------------------------------------------

# Enable H2 web console
spring.h2.console.enabled=true

# Path where H2 console will be accessible
# URL: http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# LOGGING CONFIGURATION
# Controls what gets logged to console
# -----------------------------------------------------------------------------

# Root logging level (ERROR, WARN, INFO, DEBUG, TRACE)
logging.level.root=INFO

# Logging level for our application package
# Set to DEBUG to see detailed logs during development
logging.level.com.ordermanagement=DEBUG

# Logging level for Spring Framework
logging.level.org.springframework.web=INFO

# Logging level for Hibernate (SQL and parameters)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -----------------------------------------------------------------------------
# JACKSON CONFIGURATION (JSON Serialization/Deserialization)
# Jackson is the library used by Spring Boot for JSON processing
# -----------------------------------------------------------------------------

# Pretty print JSON responses (formatted with indentation)
spring.jackson.serialization.indent_output=true

# Write dates as strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# -----------------------------------------------------------------------------
# APPLICATION INFORMATION
# Custom properties for your application
# -----------------------------------------------------------------------------

# Application name (can be used in code with @Value annotation)
application.name=Order Management System

# Application version
application.version=1.0.0

# Application description
application.description=REST API for managing customer orders
